<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#7d8ca5"/></marker>
    <marker id="aGray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#9db0c9"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="820" height="290" fill="#0e1420" rx="6"/>
  <rect x="0" y="0" width="820" height="32" fill="#d7e2f2" rx="6"/>
  <rect x="0" y="16" width="820" height="16" fill="#d7e2f2"/>
  <text x="410" y="21" text-anchor="middle" fill="#141b2c" font-size="12" font-weight="bold">NotifyTools — 出站通知 · 接口先行</text>

  <!-- Agent -->
  <rect x="30" y="55" width="160" height="50" rx="6" fill="#2a2110" stroke="#f59e0b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="110" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#fbbf24">Agent 调用 notify 工具</text>
  <text x="110" y="94" text-anchor="middle" font-size="8" fill="#fcd34d">notify(content, channel="team-lark")</text>
  <line x1="190" y1="80" x2="220" y2="80" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- NotifyTools -->
  <rect x="225" y="50" width="210" height="70" rx="8" fill="#0d2b21" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="330" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">NotifyTools</text>
  <text x="330" y="92" text-anchor="middle" font-size="9" fill="#6ee7b7">内置 Tool · 注册到 ToolRegistry</text>
  <text x="330" y="108" text-anchor="middle" font-size="8" fill="#6ee7b7">1. 按 channel name 查注册表</text>
  <text x="330" y="120" text-anchor="middle" font-size="8" fill="#6ee7b7">2. 委托给 NotifyChannelAdapter</text>

  <line x1="435" y1="80" x2="465" y2="80" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Interface -->
  <rect x="470" y="50" width="130" height="70" rx="6" fill="#191233" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="535" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#a78bfa">NotifyChannelAdapter</text>
  <text x="535" y="92" text-anchor="middle" font-size="8" fill="#a78bfa">send(target, content)</text>
  <text x="535" y="108" text-anchor="middle" font-size="7" fill="#a78bfa">接口先行 · 不绑定渠道</text>

  <!-- Implementation -->
  <line x1="535" y1="120" x2="535" y2="148" stroke="#8b5cf6" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="440" y="152" width="190" height="40" rx="6" fill="#0d2b21" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="535" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#86efac">WebhookNotifyAdapter</text>
  <text x="535" y="186" text-anchor="middle" font-size="8" fill="#6ee7b7">核心阶段唯一实现</text>

  <!-- Sandbox check side -->
  <rect x="225" y="152" width="130" height="30" rx="5" fill="#2a2110" stroke="#f59e0b" stroke-width="1"/>
  <text x="290" y="172" text-anchor="middle" font-size="8" fill="#fbbf24">过 Sandbox HTTP 白名单</text>
  <line x1="290" y1="120" x2="290" y2="150" stroke="#f59e0b" stroke-width="1"/>

  <!-- Notify channels table -->
  <rect x="30" y="140" width="160" height="70" rx="6" fill="#10203f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="110" y="160" text-anchor="middle" font-size="9" font-weight="bold" fill="#93c5fd">notify_channels 表</text>
  <line x1="42" y1="168" x2="178" y2="168" stroke="#1d3a6e" stroke-width="0.5"/>
  <text x="42" y="184" font-size="8" fill="#93c5fd">name: "team-lark"</text>
  <text x="42" y="198" font-size="8" fill="#93c5fd">type: "webhook"</text>
  <text x="42" y="212" font-size="8" fill="#93c5fd">url: "https://open.feishu.cn/..."</text>
  <line x1="190" y1="175" x2="223" y2="175" stroke="#3b82f6" stroke-width="1" marker-end="url(#a)"/>

  <!-- External targets -->
  <line x1="535" y1="192" x2="535" y2="215" stroke="#9db0c9" stroke-width="1.2" marker-end="url(#aGray)"/>
  <rect x="445" y="220" width="180" height="32" rx="5" fill="#263248" stroke="#9db0c9" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="535" y="240" text-anchor="middle" font-size="9" fill="#7d8ca5">企业微信 · 飞书 · 钉钉 群机器人</text>

  <!-- Future -->
  <rect x="225" y="220" width="200" height="40" rx="6" fill="#141b2c" stroke="#33435e" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="325" y="240" text-anchor="middle" font-size="9" fill="#9db0c9">扩展阶段：LarkNotifyAdapter</text>
  <text x="325" y="254" text-anchor="middle" font-size="8" fill="#9db0c9">WeComNotifyAdapter …</text>

  <!-- Audit -->
  <rect x="30" y="235" width="630" height="24" rx="5" fill="#33151f"/>
  <text x="345" y="252" text-anchor="middle" font-size="8" fill="#fb7185">审计：notify 与其他 Tool 一样走 ToolExecutor 现有审计路径，写入 tool_invocations 表</text>
</svg>