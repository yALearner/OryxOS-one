<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#7d8ca5"/></marker>
    <marker id="aGray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#9db0c9"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="860" height="500" fill="#0e1420" rx="6"/>
  <rect x="0" y="0" width="860" height="32" fill="#d7e2f2" rx="6"/>
  <rect x="0" y="16" width="860" height="16" fill="#d7e2f2"/>
  <text x="430" y="21" text-anchor="middle" fill="#10203f" font-size="12" font-weight="bold">定时任务子系统 — 定义有 id（⑦d 拍板 A）· 状态与历史落 SQLite · 四端点可管理 · 重启不失忆</text>
  <rect x="30" y="55" width="220" height="66" rx="6" fill="#2a2110" stroke="#f59e0b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="140.0" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#fbbf24">定义源 skill schedules</text>
  <text x="140.0" y="87" text-anchor="middle" font-size="8" fill="#fcd34d">id + cron + zone + message</text>
  <text x="140.0" y="101" text-anchor="middle" font-size="8" fill="#fcd34d">⑦d 拍板 A：Schedule 补 id · 零迁移</text>
  <rect x="290" y="55" width="250" height="80" rx="6" fill="#0d2b21" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="415.0" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#6ee7b7">AgentScheduler.registerAll</text>
  <text x="415.0" y="87" text-anchor="middle" font-size="8" fill="#86efac">注册 cron 同时登记 scheduled_tasks</text>
  <text x="415.0" y="101" text-anchor="middle" font-size="8" fill="#86efac">含算出的 next_run_at</text>
  <text x="415.0" y="115" text-anchor="middle" font-size="8" fill="#86efac">id 冲突启动报错（不静默）</text>
  <rect x="580" y="55" width="250" height="80" rx="6" fill="#10203f" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="705.0" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#93c5fd">ScheduleApiController 四端点</text>
  <text x="705.0" y="87" text-anchor="middle" font-size="8" fill="#93c5fd">GET /schedules · GET /{id}/executions</text>
  <text x="705.0" y="101" text-anchor="middle" font-size="8" fill="#93c5fd">POST /{id}/run · PUT /{id} 启用停用</text>
  <text x="705.0" y="115" text-anchor="middle" font-size="8" fill="#93c5fd">双信封：成功 ApiResponse / 错误 ErrorResponse</text>
  <rect x="30" y="175" width="220" height="66" rx="6" fill="#0d2b21" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="140.0" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#6ee7b7">真正执行（复用 008）</text>
  <text x="140.0" y="206" text-anchor="middle" font-size="8" fill="#86efac">per-task 锁 · 三元组会话</text>
  <text x="140.0" y="220" text-anchor="middle" font-size="8" fill="#86efac">agentService.process 同引擎</text>
  <rect x="290" y="175" width="250" height="66" rx="6" fill="#0d2b21" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="415.0" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#6ee7b7">到点 runOnce：先查 enabled</text>
  <text x="415.0" y="206" text-anchor="middle" font-size="8" fill="#86efac">停用 → 直接跳过（不执行不记历史）</text>
  <text x="415.0" y="220" text-anchor="middle" font-size="8" fill="#86efac">启用 → 真正执行</text>
  <rect x="30" y="275" width="220" height="66" rx="6" fill="#33151f" stroke="#fb7185" stroke-width="1.2" filter="url(#sh)"/>
  <text x="140.0" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#fb7185">停用跳过</text>
  <text x="140.0" y="306" text-anchor="middle" font-size="8" fill="#fb7185">不执行 · 不记历史</text>
  <text x="140.0" y="320" text-anchor="middle" font-size="8" fill="#fb7185">（最值钱回归钉死）</text>
  <rect x="290" y="275" width="250" height="66" rx="6" fill="#10203f" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="415.0" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#93c5fd">落库（成败都记，宪法 V 同源）</text>
  <text x="415.0" y="306" text-anchor="middle" font-size="8" fill="#93c5fd">task_executions 一条历史</text>
  <text x="415.0" y="320" text-anchor="middle" font-size="8" fill="#93c5fd">更新 last_run / last_status / run_count / next_run</text>
  <rect x="580" y="175" width="250" height="66" rx="6" fill="#0d2b21" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="705.0" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#6ee7b7">管理台「定时任务」页</text>
  <text x="705.0" y="206" text-anchor="middle" font-size="8" fill="#86efac">26 节只读管理台第一个写操作页</text>
  <text x="705.0" y="220" text-anchor="middle" font-size="8" fill="#86efac">立即执行（runNow 无视启用）· 启用停用</text>
  <rect x="30" y="390" width="800" height="80" rx="6" fill="#10203f" stroke="#7d8ca5" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#sh)"/>
  <text x="430" y="407" text-anchor="middle" font-size="10" font-weight="bold" fill="#9db0c9">验收支柱</text>
  <text x="430" y="421" text-anchor="middle" font-size="8" fill="#9db0c9">重启恢复四样（sessions / memory / schedules 状态与历史 / 审计）—— RestartRecoveryIT · 多 Agent 三边界隔离（工具/会话/定时）</text>
  <text x="430" y="435" text-anchor="middle" font-size="8" fill="#9db0c9">Demo 前置六项：三域名白名单（api.open-meteo.com + webhook + 新闻源）· notify_channels · 显式时区 · 跨重启验证</text>
  <text x="430" y="449" text-anchor="middle" font-size="8" fill="#9db0c9">明确不做：运行时增删改 cron（29·30 节）· 分布式协调 · 重试告警 · misfire 补跑</text>
  <line x1="250" y1="88" x2="288" y2="88" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="415" y1="135" x2="415" y2="173" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="290" y1="208" x2="252" y2="208" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="290" y1="208" x2="252" y2="308" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="415" y1="241" x2="415" y2="273" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="705" y1="135" x2="705" y2="173" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="415" y1="341" x2="415" y2="388" stroke="#9db0c9" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
</svg>
