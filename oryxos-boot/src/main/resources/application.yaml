# ============================================================
# OryxOS — Agent OS 统一底座
# ============================================================
# 核心阶段最小配置。Provider API key 等敏感配置通过环境变量注入。

spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true

  # SQLite 数据源
  datasource:
    url: jdbc:sqlite:.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC

  # JPA（SQLite 下禁用自动 DDL，手动维护建表脚本）
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  # Spring AI — 核心阶段通过环境变量注入真实 API key
  ai:
    openai:
      api-key: unused
      chat:
        enabled: false

# 全局层 Provider 声明（核心能力一）：这个实例接了哪些模型服务——"连不连得上"。
# Agent 层在 AGENT.md frontmatter 的 provider.name 里引用这里的 name（"怎么用"）。
# 凭证只允许 ${ENV_VAR} 占位；缺失或非法时启动校验报错，不静默失败。
oryxos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
    - name: kimi
      api-key: ${KIMI_API_KEY}
      base-url: https://api.moonshot.cn/v1

# 日志
logging:
  level:
    com.oryxos: INFO

# 监控（Actuator + Prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos
