# ============================================================
# OryxOS — Agent OS 统一底座
# ============================================================
# 核心阶段最小配置。Provider API key 等敏感配置通过环境变量注入。

spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true

  # SQLite 数据源
  datasource:
    url: jdbc:sqlite:.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC

  # JPA（SQLite 下禁用自动 DDL，手动维护建表脚本）
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  # 手工建表脚本接线（003-cli：001 review 留白的"建表脚本无人自动执行"在本课到期）——
  # SQLite 不被 Spring Boot 视为 embedded 数据库，mode 必须显式 always；
  # schema.sql 全部 CREATE TABLE IF NOT EXISTS（幂等，每次启动执行安全）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Spring AI — 核心阶段通过环境变量注入真实 API key
  ai:
    openai:
      api-key: unused
      chat:
        enabled: false

# 全局层 Provider 声明（核心能力一）：这个实例接了哪些模型服务——"连不连得上"。
# Agent 层在 AGENT.md frontmatter 的 provider.name 里引用这里的 name（"怎么用"）。
# 凭证只允许 ${ENV_VAR} 占位；缺失或非法时启动校验报错，不静默失败。
oryxos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
    - name: kimi
      api-key: ${KIMI_API_KEY}
      base-url: https://api.moonshot.cn/v1

  # Memory 后端切换（006-memory FR-6）：markdown（缺省）/ sqlite / mem0——一行换档，上层零改动。
  # 非法值启动校验明确报错不静默；后端故障快速失败不静默空记忆、不自动降级换档。
  # mem0 档凭证与地址走环境变量占位（自托管实例，数据不出域；自托管应 HTTPS）：
  #   MEM0_BASE_URL=http://自托管地址
  #   MEM0_API_KEY=${MEM0_API_KEY}
  memory:
    backend: markdown

# Sandbox 三层白名单（007-sandbox FR-2）——核心阶段唯一实现 WhitelistSandbox 的配置源。
# 空 = 什么都不允许（fail-closed，不是"不校验"）；任一为空启动打 WARN 诊断。
# 相对根按启动目录解析（构造期 toAbsolutePath）；配置构造期拷贝、不可热更新——改后须重启。
# 诚实标注：应用层白名单是劝阻级防线——防模型犯傻误操作、防不住蓄意攻击（软链/DNS rebinding 等不覆盖）。
file:
  allowed_paths:
    - .oryxos/workspace
    - /data/reports
shell:
  allowed_commands:
    - ls
    - cat
http:
  allowed_domains:
    - wttr.in
    - api.example.com

# 日志
logging:
  level:
    com.oryxos: INFO

# 监控（Actuator + Prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos
