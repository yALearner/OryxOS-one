<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#64748b"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="820" height="310" fill="#f8fafc" rx="6"/>
  <rect x="0" y="0" width="820" height="32" fill="#1e293b" rx="6"/>
  <rect x="0" y="16" width="820" height="16" fill="#1e293b"/>
  <text x="410" y="21" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">Memory 架构 — 三层记忆统一门面</text>

  <!-- ReActLoop -->
  <rect x="20" y="110" width="90" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="65" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">ReActLoop</text>
  <text x="65" y="142" text-anchor="middle" font-size="7" fill="#92400e">PromptBuilder</text>
  <line x1="110" y1="130" x2="140" y2="130" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- MemoryService Gate -->
  <rect x="145" y="50" width="280" height="60" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="285" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">MemoryService</text>
  <text x="285" y="92" text-anchor="middle" font-size="10" fill="#166534">三层记忆统一门面</text>
  <text x="285" y="106" text-anchor="middle" font-size="8" fill="#047857">ReAct 循环只调这一个接口拿到完整上下文</text>

  <!-- Three arrows -->
  <line x1="210" y1="110" x2="210" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="285" y1="110" x2="285" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="110" x2="360" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Session Memory -->
  <rect x="50" y="163" width="240" height="85" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">💬 会话记忆</text>
  <line x1="65" y1="192" x2="275" y2="192" stroke="#bfdbfe" stroke-width="0.5"/>
  <text x="65" y="208" font-size="9" fill="#1e40af">实现: SessionManager</text>
  <text x="65" y="222" font-size="9" fill="#1e40af">存储: SQLite sessions 表</text>
  <text x="65" y="236" font-size="8" fill="#3b82f6">Channel + User + Profile 标识</text>
  <text x="65" y="248" font-size="8" fill="#3b82f6">max_history_turns 截断</text>

  <!-- Long-term Memory -->
  <rect x="310" y="163" width="240" height="85" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="430" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">📝 长期记忆</text>
  <line x1="325" y1="192" x2="535" y2="192" stroke="#bbf7d0" stroke-width="0.5"/>
  <text x="325" y="208" font-size="9" fill="#166534">实现: LongTermMemoryStore</text>
  <text x="325" y="222" font-size="9" fill="#166534">默认: MEMORY.md 文件</text>
  <text x="325" y="236" font-size="8" fill="#15803d">可插拔三档后端</text>
  <text x="325" y="248" font-size="8" fill="#15803d">核心区永不被截断</text>

  <!-- Episodic -->
  <rect x="570" y="163" width="230" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="685" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#94a3b8">📋 情景记忆</text>
  <line x1="585" y1="192" x2="785" y2="192" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="585" y="208" font-size="9" fill="#94a3b8">扩展阶段</text>
  <text x="585" y="224" font-size="9" fill="#94a3b8">任务过程记录</text>
  <text x="585" y="240" font-size="9" fill="#94a3b8">修改/决策/成果</text>

  <!-- Bottom: Tool access -->
  <line x1="430" y1="248" x2="430" y2="275" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="250" y="280" width="360" height="26" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="430" y="298" text-anchor="middle" font-size="10" fill="#6d28d9">MemoryTools: save_memory → 写入 | recall_memory → 检索</text>
</svg>