<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" fill="none">
  <defs>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- ====== ICON + TEXT INTEGRATED ====== -->
  <!-- The first "O" IS the icon — a circle with horn arcs inside -->

  <!-- ORY -->
  <g transform="translate(0, 6)">
    <!-- O as icon: circle frame -->
    <circle cx="30" cy="30" r="28" fill="none" stroke="#f8fafc" stroke-width="2.5"/>

    <!-- Horn arcs inside the O -->
    <path d="M18,32 Q18,16 26,14 Q30,13 30,20"
          fill="none" stroke="url(#horn)" stroke-width="3" stroke-linecap="round"/>
    <path d="M42,32 Q42,16 34,14 Q30,13 30,20"
          fill="none" stroke="url(#horn)" stroke-width="3" stroke-linecap="round"/>

    <!-- Center core -->
    <circle cx="30" cy="36" r="4" fill="#22d3ee"/>

    <!-- RYX -->
    <text x="70" y="42" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="40" font-weight="800" letter-spacing="4" fill="#f8fafc">
      RYX
    </text>

    <!-- OS with gradient accent -->
    <text x="175" y="42" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="40" font-weight="800" letter-spacing="4" fill="url(#accent)">
      OS
    </text>
  </g>
</svg>
